  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="20" r="250" fill="#58a6ff" opacity="0.07"/>
  <circle cx="1100" cy="270" r="190" fill="#59c3c3" opacity="0.08"/>
